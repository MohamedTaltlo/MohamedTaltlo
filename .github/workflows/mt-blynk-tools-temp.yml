name: MT Blynk Tool Bootstrap Temp

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/mt-blynk-tools-temp.yml'

jobs:
  package-tools:
    runs-on: ubuntu-latest
    steps:
      - name: Download Apktool
        run: |
          mkdir -p tools
          curl -L --fail --retry 3 -o tools/apktool_2.12.0.jar https://github.com/iBotPeaches/Apktool/releases/download/v2.12.0/apktool_2.12.0.jar
          java -jar tools/apktool_2.12.0.jar --version
      - name: Upload tool
        uses: actions/upload-artifact@v4
        with:
          name: mt-blynk-apktool
          path: tools/apktool_2.12.0.jar
          retention-days: 1
